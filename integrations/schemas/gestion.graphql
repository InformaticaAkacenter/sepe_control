    DN (DNI), FI (Ficha inscripción), VL (Vida laboral), ES (Estudios), OT (Otro, por defecto)
    """
    categoria: String,
    descripcion: String,
    """Fichero a subir (requerido si no se indica url_google_drive)"""
    documento: Upload,
    fecha: Date,
    """Si se indica, el documento tiene vigencia hasta esa fecha"""
    fechaVigencia: Date,
    """Grupos (matriculado o preinscrito) a los que asociar el documento"""
    grupoIds: [ID],
    """Asociar a todos los grupos del alumno (también futuros)"""
    todosGrupos: Boolean,
    """URL de Google Drive (requerida si no se sube documento)"""
    urlGoogleDrive: String,
  ): SubirDocumentoAlumno
  updatePreinscripcion(adicional: String, apellidos: String, ciudad: String, codpostal: String, darde: String, domicilio: String, email: String, espacio: String, estudios: String, fnacimiento: Date, id: ID!, nif: String, nombre: String, notas: String, permitecomercial: Boolean, preferenciacontacto: String, preferenciahoraria: String, provinciaId: ID, sector: String, situacionlaboral: String, telefono: String, tratada: Boolean, urlExterna: String, urlorigen: String, validadodarde: Boolean): UpdatePreinscripcion
  """
  Guarda (upsert) las notas de una lista de alumnos (por NIF) en un ExamenUnidadFormativa.
  Devuelve ok=True si todos los registros se guardaron sin errores, y la lista de errores
  encontrados (p.ej. NIF no encontrado en el grupo o nota inválida).
  """
  guardarNotasExamen(examenId: ID!, notas: [NotaExamenInput!]!): GuardarNotasExamen
  tokenAuth(email: String!, password: String!): ObtainOAuth2Token
  refreshToken(refreshToken: String!): RefreshOAuth2Token
}

